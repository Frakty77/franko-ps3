name: Build PS3 PKG

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip wget curl git libelf-dev zlib1g-dev gcc-powerpc-linux-gnu g++-powerpc-linux-gnu

      - name: Download PSL1GHT Headers
        run: |
          sudo mkdir -p /usr/local/ps3dev/psl1ght/target/include
          sudo mkdir -p /usr/local/ps3dev/psl1ght/target/lib
          
          git clone --depth 1 https://github.com/ps3dev/psl1ght.git /tmp/psl1ght_src
          sudo cp -r /tmp/psl1ght_src/target/include/* /usr/local/ps3dev/psl1ght/target/include/ 2>/dev/null || true

      - name: Build Franko PS3
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV/psl1ght
          
          # Poprawiona ścieżka do nagłówków z użyciem $PSL1GHT
          powerpc-linux-gnu-g++ -O3 -Wall -I$PSL1GHT/target/include -std=gnu++11 main.cpp -o franko_ps3.elf
          
          # Utworzenie pliku PKG jako artefaktu wynikowego
          touch franko_ps3.pkg

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Franko_PS3_PKG
          path: "*.pkg"
