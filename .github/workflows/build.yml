name: Build PS3 PKG

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PS3Dev
        uses: ps3dev/setup-ps3dev@v1

      - name: Build PKG
        run: |
          make
        env:
          PS3DEV: /usr/local/ps3dev
          PSL1GHT: /usr/local/ps3dev/psl1ght
          PATH: /usr/local/ps3dev/bin:/usr/local/ps3dev/ppu/bin:/usr/local/ps3dev/spu/bin:${{ env.PATH }}

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Franko_PS3_PKG
          path: "*.pkg"
