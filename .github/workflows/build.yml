name: Build PS3 PKG

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies & PS3 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake bison flex libelf-dev libtool make patch python3 pkg-config zlib1g-dev libgmp-dev libmpfr-dev libmpc-dev libssl-dev git wget curl unzip

          # Tworzenie struktury katalogów PS3Dev
          sudo mkdir -p /usr/local/ps3dev
          sudo chmod 777 /usr/local/ps3dev

          # Pobranie gotowych skryptów ps3toolchain i kompilacja w tle (lub pobranie buildu)
          git clone https://github.com/ps3dev/ps3toolchain.git /tmp/ps3toolchain
          cd /tmp/ps3toolchain
          
          # Uruchomienie instalacji narzędzi bazowych
          ./toolchain.sh

      - name: Build PKG
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV/psl1ght
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          make

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Franko_PS3_PKG
          path: "*.pkg"
