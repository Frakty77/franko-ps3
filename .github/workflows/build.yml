name: Build PS3 PKG

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Native PowerPC Toolchain & Dependencies
        run: |
          sudo apt-get update
          # Instalujemy natywny kompilator PowerPC oraz narzędzia budowania
          sudo apt-get install -y build-essential python3 python3-pip wget curl git libelf-dev zlib1g-dev gcc-powerpc-linux-gnu g++-powerpc-linux-gnu

          # Tworzymy minimalistyczną strukturę katalogów dla PSL1GHT, żeby Makefile nie protestował
          sudo mkdir -p /usr/local/ps3dev
          sudo chmod 777 /usr/local/ps3dev
          
          git clone --depth 1 https://github.com/ps3dev/psl1ght.git /usr/local/ps3dev/psl1ght

      - name: Build Franko PS3
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV/psl1ght
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          
          # Sprawdzenie dostępności kompilatora
          which powerpc-linux-gnu-g++ || echo "Szukam alternatywy..."

          make

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Franko_PS3_PKG
          path: "*.pkg"
