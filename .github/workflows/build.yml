name: Build PS3 PKG

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/ps3dev/ps3dev:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Environment & Build
        run: |
          echo "=== Sprawdzanie gotowego środowiska w kontenerze ==="
          which powerpc-eabi-g++
          powerpc-eabi-g++ --version

          echo "=== Kompilacja gry Franko PS3 ==="
          make

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Franko_PS3_PKG
          path: "*.pkg"
