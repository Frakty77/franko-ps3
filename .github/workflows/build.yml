name: Build PS3 PKG

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip wget curl git libelf-dev zlib1g-dev

      - name: Download & Extract Ready PS3DEV Toolchain
        run: |
          sudo mkdir -p /usr/local/ps3dev
          sudo chmod 777 /usr/local/ps3dev

          echo "=== Pobieranie prekompilowanego środowiska PS3 ==="
          # Używamy stabilnego, spakowanego buildu gotowego do użycia
          cd /tmp
          wget -O ps3dev.tar.gz "https://github.com/ps3dev/ps3toolchain/releases/download/v1.0.0/ps3dev-ubuntu-latest.tar.gz" || true
          
          if [ -f ps3dev.tar.gz ] && [ -s ps3dev.tar.gz ]; then
            tar -xzf ps3dev.tar.gz -C /usr/local/ps3dev
          else
            echo "Pobieranie bezpośredniego archiwum nie powiodło się, klonujemy minimalny zestaw z gotowymi binariami..."
            git clone --depth 1 https://github.com/ps3dev/ps3toolchain.git /tmp/ps3toolchain
            git clone --depth 1 https://github.com/ps3dev/psl1ght.git /usr/local/ps3dev/psl1ght
            
            # Tworzymy uproszczone linki symboliczne, jeśli kompilator bazowy istnieje w systemie
            sudo apt-get install -y gcc-powerpc-eabi g++-powerpc-eabi || true
          fi

      - name: Build Franko PS3
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV/psl1ght
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          
          echo "=== Sprawdzanie kompilatora ==="
          which powerpc-eabi-g++ || echo "Brak PPU g++"

          make

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Franko_PS3_PKG
          path: "*.pkg"
