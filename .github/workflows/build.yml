name: Build PS3 PKG

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies & Download Ready Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip wget curl git libelf-dev zlib1g-dev

          # Tworzenie katalogu docelowego
          sudo mkdir -p /usr/local/ps3dev
          sudo chmod 777 /usr/local/ps3dev

          echo "=== Pobieranie gotowego zestawu narzędzi PS3Dev ==="
          # Pobieramy stabilny zestaw bezpośrednio z oficjalnego repozytorium lub mirrora
          cd /tmp
          wget https://github.com/ps3dev/ps3toolchain/releases/download/v1.0.0/ps3dev-ubuntu-latest.tar.gz -O ps3dev.tar.gz || true
          
          if [ -f ps3dev.tar.gz ] && [ -s ps3dev.tar.gz ]; then
            tar -xzf ps3dev.tar.gz -C /usr/local/ps3dev
          else
            echo "Archiwum nie pobrało się bezpośrednio, klonujemy minimalne repozytorium..."
            git clone --depth 1 https://github.com/ps3dev/ps3toolchain.git /tmp/ps3toolchain
            cd /tmp/ps3toolchain
            # Wskazujemy instalację tylko niezbędnych komponentów bez pełnego GCC
            ./toolchain.sh minimal || true
          fi

      - name: Build PKG
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV/psl1ght
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          
          echo "=== Sprawdzanie dostępności kompilatora ==="
          powerpc-eabi-g++ --version || echo "Ostrzeżenie: kompilator niedostępny"

          make

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Franko_PS3_PKG
          path: "*.pkg"
