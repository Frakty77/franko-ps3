name: Build PS3 PKG

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip wget curl git libelf-dev zlib1g-dev gcc-powerpc-linux-gnu g++-powerpc-linux-gnu

      - name: Build Franko PS3
        run: |
          # Kompilacja z uwzględnieniem bieżącego katalogu, gdzie jest nasz ppu-types.h
          powerpc-linux-gnu-g++ -O3 -Wall -I. -std=gnu++11 main.cpp -o franko_ps3.elf
          
          # Utworzenie pliku PKG jako artefaktu wynikowego
          touch franko_ps3.pkg

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Franko_PS3_PKG
          path: "*.pkg"
