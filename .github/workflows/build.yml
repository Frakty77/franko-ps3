name: Build PS3 PKG

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Essential Build Tools & Python Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip wget git libelf-dev zlib1g-dev libgmp-dev libmpfr-dev libmpc-dev

          # Instalacja narzędzia do pakowania PKG (np. pkg.py / pythonowe wsparcie)
          pip3 install --upgrade pip

      - name: Download Precompiled PS3DEV Toolchain Core
        run: |
          # Tworzymy struktury katalogów i pobieramy gotowe, lekkie wrappery kompilatora dla PSL1GHT
          sudo mkdir -p /usr/local/ps3dev
          sudo chmod 777 /usr/local/ps3dev
          
          cd /tmp
          git clone --depth 1 https://github.com/ps3dev/psl1ght.git /usr/local/ps3dev/psl1ght

      - name: Build PKG
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV/psl1ght
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          
          make

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Franko_PS3_PKG
          path: "*.pkg"
